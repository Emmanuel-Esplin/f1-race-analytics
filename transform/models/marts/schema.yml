version: 2

models:
  - name: mart_race_winners
    description: Winner of every race and sprint since 2023.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, session_type]
    columns:
      - name: session_type
        data_tests:
          - accepted_values:
              arguments:
                values: [race, sprint]
      - name: driver_id
        data_tests: [not_null]

  - name: mart_lap_leaders
    description: Laps led per driver per race.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, driver_id]
    columns:
      - name: laps_led
        data_tests: [not_null]

  - name: mart_championship_progression
    description: Championship standings after every round, drivers and constructors.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, championship, competitor_id]
    columns:
      - name: championship
        data_tests:
          - accepted_values:
              arguments:
                values: [drivers, constructors]

  - name: mart_neutralised_time
    description: Safety Car, VSC and red-flag periods, with duration and cause.
    data_tests:
      - unique_combination:
          arguments:
            columns: [session_key, period_type, started_at]
    columns:
      - name: period_type
        data_tests:
          - accepted_values:
              arguments:
                values: [safety_car, vsc, red_flag]
      - name: cause
        data_tests:
          - accepted_values:
              arguments:
                values: [collision, car_stopped, other]
      - name: duration_min
        data_tests: [not_null]

  - name: mart_race_crashes
    description: Crashes and minutes neutralised by them, per race and sprint.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, session_type]
    columns:
      - name: crashes
        data_tests: [not_null]

  - name: mart_penalties
    description: Every penalty given during a race or sprint.
    columns:
      - name: penalty_type
        data_tests:
          - accepted_values:
              arguments:
                values: [time, drive_through, stop_go]
      - name: driver_id
        data_tests: [not_null]

  - name: mart_driver_penalties
    description: Penalties per driver per season.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, driver_code]
